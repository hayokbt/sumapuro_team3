version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: gomoku-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: gomoku_db
      MYSQL_USER: gomoku_user
      MYSQL_PASSWORD: gomoku_password
    ports:
      - "3305:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: