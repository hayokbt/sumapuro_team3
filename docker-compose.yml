services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    environment:
      BACKEND_URL: http://backend:8080
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  backend:
    volumes:
      - auth_data:/var/lib/gomoku/auth
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_SECRET_FILE: /var/lib/gomoku/auth/jwt-secret
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      APP_ORIGINS: ${APP_ORIGINS:-http://localhost:5173,http://localhost:3000}
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: gomoku_user
      DB_PASSWORD: gomoku_password
      DB_NAME: gomoku_db
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: no-reply@example.com
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  db:
    image: mysql:8.0
    container_name: gomoku-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: gomoku_db
      MYSQL_USER: gomoku_user
      MYSQL_PASSWORD: gomoku_password
    ports:
      - "3305:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: unless-stopped

volumes:
  mysql_data:
  auth_data: