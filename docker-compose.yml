services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: gomoku_user
      DB_PASSWORD: gomoku_password
      DB_NAME: gomoku_db
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: gomoku-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: gomoku_db
      MYSQL_USER: gomoku_user
      MYSQL_PASSWORD: gomoku_password
    ports:
      - "3305:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: unless-stopped

volumes:
  mysql_data: